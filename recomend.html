<button onclick="goToDetails(0)">تفاصيل الكمبيوتر</button>

<script>
  function goToDetails(computerId) {
    // الانتقال لصفحة التفاصيل مع تمرير الـ id في الرابط
    window.location.href = `details.html?id=${computerId}`;
  }
</script>
        <button onclick="findMyPC()">ابحث</button>
